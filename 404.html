<script type="module">
import * as THREE from 'three';
import {OrbitControls} from 'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/controls/OrbitControls.js';
import {FontLoader} from 'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/loaders/FontLoader.js';
import {TextGeometry} from 'https://cdn.jsdelivr.net/npm/three@0.179.1/examples/jsm/geometries/TextGeometry.js';
const scene=new THREE.Scene();scene.background=new THREE.Color(0x020305);scene.fog=new THREE.FogExp2(0x020305,.035);
const camera=new THREE.PerspectiveCamera(42,innerWidth/innerHeight,.1,100);camera.position.set(0,1.2,13);
const renderer=new THREE.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio, innerWidth <= 700 ? 1.5 : 2));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;document.getElementById('scene').appendChild(renderer.domElement);
const controls=new OrbitControls(camera,renderer.domElement);controls.enableDamping=true;controls.enableZoom=false;controls.enablePan=false;controls.autoRotate=true;controls.autoRotateSpeed=.35;controls.minPolarAngle=1.1;controls.maxPolarAngle=2.0;
scene.add(new THREE.AmbientLight(0xffffff,.35));const key=new THREE.PointLight(0xffffff,65,30);key.position.set(0,4,7);scene.add(key);const warm=new THREE.PointLight(0xffa33b,120,18);warm.position.set(0,-1,3);scene.add(warm);const rim=new THREE.PointLight(0x8ab4ff,90,22);rim.position.set(-7,2,-4);scene.add(rim);
const root=new THREE.Group();scene.add(root);

function applyResponsiveScene(){
    const mobile=innerWidth<=700;
    const portrait=innerWidth/innerHeight<0.75;
    if(mobile){
        camera.fov=portrait?48:44;
        camera.position.set(0,1.0,portrait?21:17);
        root.scale.setScalar(portrait?.92:1);
    }else{
        camera.fov=42;
        camera.position.set(0,1.2,13);
        root.scale.setScalar(1);
    }
    camera.updateProjectionMatrix();
}
applyResponsiveScene();
new FontLoader().load('https://cdn.jsdelivr.net/npm/three@0.179.1/examples/fonts/helvetiker_bold.typeface.json',font=>{const geo=new TextGeometry('404',{font,size:4,depth:.75,curveSegments:8,bevelEnabled:true,bevelThickness:.08,bevelSize:.045,bevelSegments:3});geo.center();const mat=new THREE.MeshPhysicalMaterial({color:0x8b8d91,metalness:.82,roughness:.3,clearcoat:.8,clearcoatRoughness:.16,emissive:0x17110a,emissiveIntensity:.5});root.add(new THREE.Mesh(geo,mat));const shardMat=new THREE.MeshStandardMaterial({color:0x6e7074,metalness:.9,roughness:.25});for(let i=0;i<110;i++){const s=new THREE.Mesh(new THREE.TetrahedronGeometry(THREE.MathUtils.randFloat(.035,.18),0),shardMat);const a=Math.random()*Math.PI*2,r=THREE.MathUtils.randFloat(2.3,5.5);s.position.set(Math.cos(a)*r*1.15,THREE.MathUtils.randFloat(-2.7,2.7),THREE.MathUtils.randFloat(-.5,2.3));s.rotation.set(Math.random()*6,Math.random()*6,Math.random()*6);s.userData={speed:THREE.MathUtils.randFloat(.2,.8)};root.add(s)}});
for(let i=0;i<3;i++){const ring=new THREE.Mesh(new THREE.TorusGeometry(4+i*.85,.012,8,160),new THREE.MeshBasicMaterial({color:i===1?0xffb15a:0xbfd8ff,transparent:true,opacity:.35}));ring.rotation.x=Math.PI/2;ring.position.z=-1.8-i*.45;ring.userData.speed=(i%2?-1:1)*(.05+i*.025);root.add(ring)}
const slabMat=new THREE.MeshStandardMaterial({color:0x101216,metalness:.7,roughness:.4});for(let i=0;i<18;i++){const s=new THREE.Mesh(new THREE.BoxGeometry(THREE.MathUtils.randFloat(.25,1.3),THREE.MathUtils.randFloat(.12,.5),THREE.MathUtils.randFloat(.25,1)),slabMat);s.position.set(THREE.MathUtils.randFloatSpread(15),THREE.MathUtils.randFloat(-4,5),THREE.MathUtils.randFloat(-5,2));s.rotation.set(Math.random()*3,Math.random()*3,Math.random()*3);s.userData.speed=THREE.MathUtils.randFloat(.05,.2);scene.add(s)}
const count=1800,pos=new Float32Array(count*3);for(let i=0;i<count;i++){pos[i*3]=THREE.MathUtils.randFloatSpread(22);pos[i*3+1]=THREE.MathUtils.randFloat(-9,9);pos[i*3+2]=THREE.MathUtils.randFloat(-8,4)}const pg=new THREE.BufferGeometry();pg.setAttribute('position',new THREE.BufferAttribute(pos,3));
const particleSpeed=new Float32Array(count),particlePhase=new Float32Array(count);
for(let i=0;i<count;i++){particleSpeed[i]=THREE.MathUtils.randFloat(.12,.42);particlePhase[i]=Math.random()*Math.PI*2}
const particleField=new THREE.Points(pg,new THREE.PointsMaterial({color:0xcfd5df,size:.018,transparent:true,opacity:.7}));
scene.add(particleField);
const mouse=new THREE.Vector2(),target=new THREE.Vector2();addEventListener('pointermove',e=>{target.x=(e.clientX/innerWidth-.5)*2;target.y=(e.clientY/innerHeight-.5)*2});addEventListener('pointerdown',()=>{root.children.forEach(o=>{if(o.isMesh&&o.geometry.type==='TetrahedronGeometry'){o.position.x+=THREE.MathUtils.randFloatSpread(.8);o.position.y+=THREE.MathUtils.randFloatSpread(.8)}});warm.intensity=220;setTimeout(()=>warm.intensity=120,220)});
function animate(t){
    requestAnimationFrame(animate);
    mouse.lerp(target,.035);

    root.rotation.y+=(mouse.x*.08-root.rotation.y)*.025;
    root.rotation.x+=(-mouse.y*.045-root.rotation.x)*.025;

    root.children.forEach(o=>{
        if(o.userData.speed)o.rotation.z+=o.userData.speed*.002;
    });

    const p=particleField.geometry.attributes.position.array;
    const time=t*.001;
    for(let i=0;i<count;i++){
        const j=i*3;
        p[j+1]+=particleSpeed[i]*.0025;
        p[j]+=Math.sin(time*.45+particlePhase[i])*.0007;
        p[j+2]+=Math.cos(time*.35+particlePhase[i])*.0005;
        if(p[j+1]>9)p[j+1]=-9;
    }
    particleField.geometry.attributes.position.needsUpdate=true;

    controls.update();
    renderer.render(scene,camera);
}
animate(0);setTimeout(()=>document.getElementById('loader').classList.add('hide'),1500);
addEventListener('resize',()=>{
